version: 2

models:
  - name: fct_daily_sleep
    columns:
      - name: person_key
        data_type: string
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: person_key
      - name: date_key
        data_type: string
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: date_day
        data_type: date
      - name: bed_time
        data_type: time
      - name: wake_up_time
        data_type: time
      - name: amount_of_nightly_sleep_hours
        data_type: float64
      - name: sleep_band
        data_type: string
