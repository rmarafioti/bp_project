version: 2

models:
  - name: int_daily_sleep
    columns:
      - name: person_id
        data_type: int64
      - name: date_day
        data_type: date
      - name: year
        data_type: int64
      - name: bed_time
        data_type: time
      - name: wake_up_time
        data_type: time
      - name: amount_of_nightly_sleep_hours
        data_type: float64
      - name: sleep_band
        data_type: string
