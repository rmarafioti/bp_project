version: 2

models:
  - name: fct_monthly_sleep
    columns:
      - name: person_key
        data_type: string
        description: '{{ doc("person_key") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: person_key
      - name: month_key
        data_type: string
        description: '{{ doc("month_key") }}'
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_key
      - name: person_id
        data_type: int64
        description: '{{ doc("person_id") }}'
      - name: month
        data_type: int64
      - name: year
        data_type: int64
      - name: average_nightly_sleep_hours
        data_type: float64
      - name: percent_met_nightly_sleep_goal
        data_type: float64
        description: '{{ doc("percent_met_nightly_sleep_goal") }}'
