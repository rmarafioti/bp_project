version: 2

models:
  - name: wide_daily_sleep
    columns:
      - name: person_key
        data_type: string
      - name: person_id
        data_type: int64
      - name: person_display_name
        data_type: string
      - name: date_of_birth
        data_type: date
      - name: age
        data_type: int64
      - name: gender
        data_type: string
      - name: height
        data_type: string
      - name: date_day
        data_type: date
      - name: month
        data_type: int64
      - name: month_name
        data_type: string
      - name: year
        data_type: int64
      - name: bed_time
        data_type: time
      - name: wake_up_time
        data_type: time
      - name: amount_of_nightly_sleep_hours
        data_type: float64
      - name: sleep_band
        data_type: string
