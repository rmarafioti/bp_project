version: 2

sources:
  - name: google_sheets
    description: "..."
    database: bpproject-504300
    schema: bp_dev
    tables:
      - name: bp_readings_raw
        description: Live external table reading directly from the BP tracking Google Sheet
        columns:
          - name: person_id
            data_type: int64
          - name: bp_reading_date
            data_type: date
          - name: month
            data_type: int64
          - name: year
            data_type: int64
          - name: time_of_day
            data_type: string
          - name: systolic_reading
            data_type: int64
          - name: diastolic_reading
            data_type: int64
            data_type: int64
          - name: general_mood
            data_type: string
      - name: person_information_raw
        description: Live external table reading directly from the Person Information tracking Google Sheet
        columns:
          - name: person_id
            data_type: int64
          - name: person_first_name
            data_type: string
          - name: person_last_name
            data_type: string
          - name: perosn_display_name
            data_type: string
          - name: date_of_birth
            data_type: date
          - name: gender
            data_type: string
          - name: height
            data_type: string
      - name: physical_activity_raw
        description: Live external table reading directly from the Physical Activity tracking Google Sheet
        columns:
          - name: person_id
            data_type: int64
          - name: activity_date
            data_type: date
          - name: time_of_day
            data_type: string
          - name: person_weight
            data_type: float64
          - name: average_heart_rate
            data_type: int64
          - name: physical_activity_
            data_type: string
          - name: physical_activity_distance_
            data_type: float64
          - name: calories_burned
            data_type: int64
      - name: daily_hydration_raw
        description: Live external table reading directly from the Daily Hydration tracking Google Sheet
        columns:
          - name: person_id
            data_type: int64
          - name: activity_date
            data_type: date
          - name: has_caffiene_
            data_type: boolean
          - name: caffiene_description
            data_type: string
          - name: has_reached_target_hydration
            data_type: boolean
          - name: water_hydration_goal
            data_type: string
