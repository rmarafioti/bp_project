version: 2

models:
  - name: stg_daily_sleep
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - person_id
            - date_day
    columns:
      - name: person_id
        data_type: int64
      - name: date_day
        data_type: date
      - name: month
        data_type: int64
      - name: year
        data_type: int64
      - name: bed_time
        data_type: time
      - name: wake_up_time
        data_type: time
