version: 2

models:
  - name: stg_physical_activity
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - person_id
            - date_day
    columns:
      - name: person_id
        data_type: int64
        description: '{{ doc("person_id") }}'
      - name: day_date
        data_type: date
      - name: time_of_day
        data_type: string
        description: '{{ doc("time_of_day") }}'
      - name: weight
        data_type: float64
        description: '{{ doc("weight") }}'
      - name: average_heart_rate
        data_type: int64
        description: '{{ doc("average_heart_rate") }}'
      - name: physical_activity
        data_type: string
        description: '{{ doc("physical_activity") }}'
      - name: physical_activity_distance
        data_type: float64
        description: '{{ doc("physical_activity") }}'
      - name: calories_burned
        data_type: int64
      - name: physical_activity_intensity
        data_type: string
        description: '{{ doc("physical_activity_intensity") }}'
