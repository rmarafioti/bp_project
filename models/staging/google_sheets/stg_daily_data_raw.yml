version: 2

models:
  - name: stg_daily_data_raw
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - date_day
    columns:
      - name: person_id
        data_type: int64
        description: '{{ doc("person_id") }}'
      - name: date_day
        data_type: date
      - name: month
        data_type: int64
      - name: year
        data_type: int64
      - name: bp_time_of_day
        data_type: string
        description: '{{ doc("time_of_day") }}'
      - name: general_mood
        data_type: string
        description: '{{ doc("general_mood") }}'
      - name: systolic_reading
        data_type: int64
        description: '{{ doc("systolic_reading") }}'
      - name: diastolic_reading
        data_type: int64
        description: '{{ doc("diastolic_reading") }}'
      - name: bp_reading
        data_type: string
        description: '{{ doc("bp_reading") }}'
      - name: bp_category
        data_type: string
        description: '{{ doc("bp_category") }}'
      - name: caffeine_drink_count
        data_type: int64
      - name: caffeine_drink_description
        data_type: string
      - name: water_intake_oz
        data_type: int64
      - name: physical_activity_time_of_day
        data_type: string
        description: '{{ doc("time_of_day") }}'
      - name: weight
        data_type: float64
        description: '{{ doc("weight") }}'
      - name: average_heart_rate
        data_type: int64
        description: '{{ doc("average_heart_rate") }}'
      - name: physical_activity
        data_type: string
        description: '{{ doc("physical_activity") }}'
      - name: physical_activity_distance
        data_type: float64
        description: '{{ doc("physical_activity") }}'
      - name: physical_activity_duration
        data_type: float64
        description: '{{ doc("physical_activity_duration") }}'
      - name: calories_burned
        data_type: int64
      - name: physical_activity_intensity
        data_type: string
        description: '{{ doc("physical_activity_intensity") }}'
      - name: bed_time
        data_type: time
      - name: wake_up_time
        data_type: time
