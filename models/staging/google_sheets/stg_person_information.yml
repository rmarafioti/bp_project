version: 2

models:
  - name: stg_person_information
    columns:
      - name: person_id
        data_type: int64
        description: '{{ doc("person_id") }}'
        data_tests:
          - unique
          - not_null
      - name: person_first_name
        data_type: string
      - name: person_last_name
        data_type: string
      - name: person_display_name
        data_type: string
      - name: date_of_birth
        data_type: date
      - name: age
        data_type: int64
      - name: gender
        data_type: string
      - name: height
        data_type: string
