version: 2

models:
  - name: stg_bp_readings
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - person_id
            - date_day
    columns:
      - name: person_id
        data_type: int64
      - name: day_date
        data_type: date
      - name: year
        data_type: int64
      - name: month
        data_type: int64
      - name: time_of_day
        data_type: string
      - name: systolic_reading
        data_type: int64
      - name: diastolic_reading
        data_type: int64
      - name: bp_reading
        data_type: string
      - name: bp_category
        data_type: string
      - name: general_mood
        data_type: string
