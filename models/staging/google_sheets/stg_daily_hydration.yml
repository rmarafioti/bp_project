version: 2

models:
  - name: stg_daily_hydration
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - person_id
            - date_day
    columns:
      - name: person_id
        data_type: int64
      - name: date_day
        data_type: date
      - name: month
        data_type: int64
      - name: year
        data_type: int64
      - name: caffeine_drink_count
        date_day: int64
      - name: caffeine_drink_description
        data_type: string
      - name: water_intake_oz
        data_type: int64
