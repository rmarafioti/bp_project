version: 2

models:
  - name: stg_daily_hydration
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - person_id
            - day_date
    columns:
      - name: person_id
        data_type: int64
        description: '{{ doc("person_id") }}'
      - name: day_date
        data_type: date
      - name: has_caffiene
        data_type: boolean
      - name: caffiene_description
        data_type: string
      - name: has_reached_target_hydration
        data_type: boolean
      - name: water_hydration_goal
        data_type: string
