version: 2

models:
  - name: wide_physical_activity
    columns:
      - name: physical_activity_key
        data_type: string
        description: '{{ doc("physical_activity_key") }}'
      - name: person_key
        data_type: string
      - name: person_id
        data_type: int64
      - name: person_display_name
        data_type: string
      - name: date_of_birth
        data_type: date
      - name: age
        data_type: int64
      - name: gender
        data_type: string
      - name: height
        data_type: string
      - name: weight
        data_type: float64
      - name: day_date
        data_type: date
      - name: month
        data_type: int64
      - name: month_name
        data_type: string
      - name: year
        data_type: int64
      - name: time_of_day
        data_type: string
        description: '{{ doc("time_of_day") }}'
      - name: physical_activity
        data_type: string
        description: '{{ doc("physical_activity") }}'
      - name: physical_activity_intensity
        data_type: string
        description: '{{ doc("physical_activity_intensity") }}'
      - name: average_heart_rate
        data_type: int64
        description: '{{ doc("average_heart_rate") }}'
      - name: physical_activity_distance
        date_type: float64
        description: '{{ doc("physical_activity_distance") }}'
      - name: physical_activity_duration
        date_type: float64
        description: '{{ doc("physical_activity_duration") }}'
      - name: calories_burned
        data_type: int64
