version: 2

models:
  - name: fct_physical_activity
    columns:
      - name: physical_activity_key
        data_type: string
        description: '{{ doc("physical_activity_key") }}'
        data_tests:
          - unique
          - not_null
        -relationships:
          to: ref('dim_physical_activity')
          field: physical_activity_key
      - name: person_key
        data_type: string
        data_tests:
          - not_null
        -relationships:
          to: ref('dim_person')
          field: person_key
      - name: date_key
        data_type: string
        data_tests:
          - unique
          - not_null
        -relationships:
          to: ref('dim_date')
          field: date_key
      - name: date_day
        data_type: date
      - name: weight
        data_type: float64
      - name: average_heart_rate
        data_type: int64
        description: '{{ doc("average_heart_rate") }}'
      - name: physical_activity_distance
        date_type: float64
        description: '{{ doc("physical_activity_distance") }}'
      - name: physical_activity_duration
        date_type: float64
        description: '{{ doc("physical_activity_duration") }}'
      - name: calories_burned
        data_type: int64
