version: 2

models:
  - name: fct_monthly_physical_activity
    columns:
      - name: person_key
        data_type: string
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: person_key
      - name: month_key
        data_type: string
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_key
      - name: person_id
        data_type: int64
      - name: month
        data_type: int64
      - name: year
        data_type: int64
      - name: physical_activity_count
        data_type: int64
      - name: total_average_heart_rate
        data_type: int64
      - name: total_physical_activity_distance
        data_type: float64
      - name: total_physical_activity_duration
        data_type: float64
      - name: total_calories_burned
        data_type: int64
      - name: total_moderate_intensity_hours
        data_type: int64
      - name: has_met_monthly_moderate_hours
        data_type: int64
      - name: total_vigorous_intensity_hours
        data_type: float64
      - name: has_met_monthly_vigorous_hours
        data_type: int64
