version: 2

models:
  - name: avg_bp_readings
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - metric_category
            - metric_subcategory
            - metric_name
            - metric_period
    columns:
      - name: person_key
        data_type: string
      - name: person_id
        data_type: int64
      - name: metric_category
        data_type: string
      - name: metric_subcategory
        data_type: string
      - name: metric_name
        data_type: string
      - name: metric_period
        data_type: string
      - name: metric_reading
        data_type: string
      - name: metric_value
        data_type: float64
      - name: metric_label
        data_type: string
      - name: has_met_goal
        data_type: int64
