version: 2

models:
  - name: dim_bp_readings
    columns:
      - name: bp_reading_key
        data_type: string
        data_tests:
          - unique
          - not_null
        description: '{{ doc("bp_reading_key") }}'
      - name: day_date
        data_type: date
      - name: month
        data_type: int64
      - name: month_name
        data_type: date
      - name: year
        data_type: int64
      - name: time_of_day
        data_type: string
        description: '{{ doc("time_of_day") }}'
      - name: bp_category
        data_type: string
        description: '{{ doc("bp_category") }}'
      - name: general_mood
        data_type: string
        description: '{{ doc("general_mood") }}'
