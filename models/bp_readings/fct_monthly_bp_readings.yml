version: 2

models:
  - name: fct_monthly_bp_readings
    columns:
      - name: person_key
        data_type: string
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: person_key
      - name: month_key
        data_type: string
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_key
      - name: person_id
        data_type: int64
      - name: month
        data_type: int64
      - name: year
        data_type: int64
      - name: bp_reading_count
        data_type: int64
      - name: weight_count
        data_type: float64
      - name: total_weight
        data_type: float64
      - name: latest_monthly_recorded_weight
        data_type: floatt64
      - name: total_systolic_readings
        data_type: int64
      - name: total_diastolic_readings
        data_type: int64
      - name: total_systolic_absolute_change_from_previous_day
        data_type: int64
      - name: total_diastolic_absolute_change_from_previous_day
        data_type: int64
      - name: normal_bp_category_count
        data_type: int64
      - name: most_common_monthly_bp_category
        data_type: string
      - name: most_common_monthly_bp_category_count
        data_type: int64
