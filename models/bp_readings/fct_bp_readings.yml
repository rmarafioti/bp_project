version: 2

models:
  - name: fct_bp_readings
    columns:
      - name: person_key
        data_type: string
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: person_key
      - name: date_key
        data_type: string
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: date_day
        data_type: date
      - name: time_of_day
        data_type: string
      - name: general_mood
        data_type: string
      - name: weight
        data_type: float64
      - name: systolic_reading
        data_type: int64
        description: '{{ doc("systolic_reading") }}'
      - name: diastolic_reading
        data_type: int64
        description: '{{ doc("diastolic_reading") }}'
      - name: bp_reading
        data_type: string
        description: '{{ doc("bp_reading") }}'
      - name: bp_category
        data_type: string
      - name: systolic_change_from_previous_day
        data_type: int64
        description: '{{ doc("systolic_change_from_previous_day") }}'
      - name: diastolic_change_from_previous_day
        data_type: int64
        description: '{{ doc("diastolic_change_from_previous_day") }}'
