version: 2

models:
  - name: wide_monthly_bp_readings
    columns:
      - name: person_key
        data_type: string
      - name: person_id
        data_type: int64
      - name: person_display_name
        data_type: string
      - name: date_of_birth
        data_type: date
      - name: age
        data_type: int64
      - name: gender
        data_type: string
      - name: height
        data_type: string
      - name: month
        data_type: int64
      - name: month_name
        data_type: string
      - name: year
        data_type: int64
      - name: bp_reading_count
        data_type: int64
      - name: weight_count
        data_type: float64
      - name: total_weight
        data_type: float64
      - name: total_systolic_readings
        data_type: int64
      - name: total_diastolic_readings
        data_type: int64
      - name: total_systolic_absolute_change_from_previous_day
        data_type: int64
      - name: total_diastolic_absolute_change_from_previous_day
        data_type: int64
      - name: most_common_monthly_bp_category
        data_type: string
      - name: most_common_monthly_bp_category_count
        data_type: int64
