version: 2

models:
  - name: int_bp_readings
    columns:
      - name: person_id
        data_type: int64
      - name: day_date
        data_type: date
      - name: year
        data_type: int64
      - name: weight
        data_type: float64
      - name: systolic_reading
        data_type: int64
      - name: diastolic_reading
        data_type: int64
      - name: bp_reading
        data_type: string
      - name: systolic_change_from_previous_day
        data_type: int64
      - name: diastolic_change_from_previous_day
        data_type: int64
