version: 2

models:
  - name: wide_bp_readings
    columns:
      - name: bp_reading_key
        data_type: string
        description: '{{ doc("bp_reading_key") }}'
      - name: day_date
        data_type: date
      - name: month
        data_type: int64
      - name: month_name
        data_type: string
      - name: year
        data_type: int64
      - name: time_of_day
        data_type: string
        description: '{{ doc("time_of_day") }}'
      - name: general_mood
        data_type: string
        description: '{{ doc("general_mood") }}'
      - name: systolic_reading
        data_type: int64
        description: '{{ doc("systolic_reading") }}'
      - name: diastolic_reading
        data_type: int64
        description: '{{ doc("diastolic_reading") }}'
      - name: bp_reading
        data_type: string
        description: '{{ doc("bp_reading") }}'
      - name: bp_category
        data_type: string
        description: '{{ doc("bp_category") }}'
      - name: systolic_change_from_previous_day
        data_type: int64
      - name: diastolic_change_from_previous_day
        data_type: int64
