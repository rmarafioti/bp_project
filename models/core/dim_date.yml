version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        data_type: string
      - name: date_day
        data_type: date
        data_tests:
          - unique
          - not_null
      - name: month_key
        data_type: string
      - name: month
        data_type: int64
      - name: month_name
        data_type: string
      - name: year
        data_type: int64
      - name: week_start_date
        data_type: date
      - name: week_end_date
        data_type: date
