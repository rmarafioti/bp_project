version: 2

models:
  - name: int_monthly_hydration_and_caffeine
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - month
              - year
    columns:
      - name: person_id
        data_type: int64
      - name: month
        data_type: int64
      - name: year
        data_type: int64
      - name: average_daily_caffeine_intake
        data_type: float64
      - name: percent_met_water_intake_goal
        data_type: float64
