version: 2

models:
  - name: fct_hydration_and_caffeine
    columns:
      - name: person_key
        data_type: string
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: person_key
      - name: date_key
        data_type: string
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: date_day
        data_type: date
      - name: caffeine_drink_count
        data_type: int64
      - name: caffeine_drink_description
        data_type: string
      - name: water_intake_oz
        data_type: int64
      - name: hydration_band
        data_type: string
