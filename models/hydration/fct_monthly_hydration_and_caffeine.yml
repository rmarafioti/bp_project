version: 2

models:
  - name: fct_monthly_hydration_and_caffeine
    columns:
      - name: person_key
        data_type: string
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_person')
                field: person_key
      - name: month_key
        data_type: string
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_key
      - name: person_id
        data_type: int64
      - name: month
        data_type: int64
      - name: year
        data_type: int64
      - name: average_daily_caffeine_intake
        data_type: float64
      - name: percent_met_water_intake_goal
        data_type: float64
